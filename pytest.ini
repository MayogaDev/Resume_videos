[pytest]
# Configuración de pytest para el proyecto

# Directorio donde buscar tests
testpaths = tests

# Patrón de archivos de tests
python_files = test_*.py

# Patrón de clases de tests
python_classes = Test*

# Patrón de funciones de tests
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Tests unitarios rápidos
    integration: Tests de integración (pueden ser lentos)
    e2e: Tests end-to-end completos
    slow: Tests que tardan mucho tiempo
    requires_video: Tests que requieren un video de prueba

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Configuración de cobertura
[coverage:run]
source = backend
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
